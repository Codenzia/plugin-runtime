name: Plugin Release (reusable)

# Reusable release workflow with two entry points:
#
#   * A pushed `v*` tag (the "Cut release" button) is a PRIVATE release only:
#     a GitHub Release on the caller repo when that repo is private, plus the
#     Satis notify so packages.codenzia.com lists the version. It never pushes
#     to a public mirror and never creates a release on a public repo.
#   * `workflow_dispatch` run from the tag ref ("Release to public", pressed by
#     the owner) additionally mirrors the tagged commit + tag to `public_repo`
#     and creates the GitHub Release there. Packagist picks the tag up via its
#     webhook on the public repo.
#
# Example caller in <plugin>-dev/.github/workflows/release.yml:
#
#   on:
#     push:
#       tags: ['v*']
#     workflow_dispatch:      # Run workflow -> "Use workflow from" = the tag
#   jobs:
#     release:
#       permissions:
#         contents: write
#       uses: Codenzia/plugin-runtime/.github/workflows/plugin-release.yml@v1.6.0
#       with:
#         public_repo: Codenzia/filament-panel-base   # omit when there is no mirror
#       secrets: inherit

on:
  workflow_call:
    inputs:
      public_repo:
        description: |
          Public mirror repo in <org/name> format, e.g. "Codenzia/filament-panel-base".
          When set, a workflow_dispatch run pushes HEAD + the tag to that repo
          (uses CODENZIA_PAT). Tag-push runs never touch it. When empty, the
          GitHub Release is created on the caller repo.
        required: false
        type: string
        default: ""
      target_branch:
        description: "Branch to push HEAD to on the public mirror"
        required: false
        type: string
        default: "main"
      create_github_release:
        description: "Create a GitHub Release on the resulting (public) repo from the tag"
        required: false
        type: boolean
        default: true
      changelog_path:
        description: "Path to CHANGELOG.md. Used to extract release notes for the matching tag."
        required: false
        type: string
        default: "CHANGELOG.md"
    secrets:
      CODENZIA_PAT:
        required: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (with full history + tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Don't leave the default github-actions token persisted in
          # .git/config — it overrides the CODENZIA_PAT auth header on the
          # mirror push, so the push goes out as github-actions[bot] and is
          # denied (403) on the public repo. With this off, only the explicit
          # PAT header is used.
          persist-credentials: false

      - name: Verify tag shape
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "Refusing to release: run this from a tag ref (Run workflow -> Use workflow from -> Tags -> vX.Y.Z), not '${GITHUB_REF_NAME}'." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing to release: tag '${GITHUB_REF_NAME}' is not semver-shaped (vMAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi
          echo "tag: ${GITHUB_REF_NAME} (event: ${GITHUB_EVENT_NAME})"

      - name: Decide what this run may publish
        # Public surfaces (the mirror, a release on a public repo, and through
        # them Packagist) are owner-click only: they need a workflow_dispatch.
        # A tag push stays private. `repository.private` is the caller repo.
        id: scope
        env:
          PUBLIC_REPO: ${{ inputs.public_repo }}
          CALLER_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "public=true" >> "$GITHUB_OUTPUT"
            echo "Manual public release: mirror + release on the public repo are allowed."
            exit 0
          fi
          echo "public=false" >> "$GITHUB_OUTPUT"
          if [ -n "$PUBLIC_REPO" ]; then
            echo "::notice::Tag push: Satis only. Publish to ${PUBLIC_REPO} with the release workflow's 'Run workflow' button on tag ${GITHUB_REF_NAME}."
          elif [ "$CALLER_PRIVATE" != "true" ]; then
            echo "::notice::This repo is public, so no GitHub Release is created on a tag push. Create it with 'Run workflow' on tag ${GITHUB_REF_NAME}."
          fi

      - name: Push commit + tag to public mirror
        if: ${{ inputs.public_repo != '' && steps.scope.outputs.public == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          PUBLIC_REPO: ${{ inputs.public_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "CODENZIA_PAT secret not set; cannot push to $PUBLIC_REPO" >&2
            exit 1
          fi
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git remote add public "https://github.com/${PUBLIC_REPO}.git"
          # Ephemeral header-based auth: never written to .git/config (unlike a
          # token-in-URL remote), so the PAT can't leak via a later config dump.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Populate refs/remotes/public/<branch> so --force-with-lease has a
          # lease to check; tolerate a not-yet-existing branch (first release).
          git -c http.extraheader="$AUTH_HEADER" fetch public "+refs/heads/${TARGET_BRANCH}:refs/remotes/public/${TARGET_BRANCH}" || true
          echo "Pushing HEAD to ${PUBLIC_REPO}:${TARGET_BRANCH}"
          git -c http.extraheader="$AUTH_HEADER" push public "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease
          echo "Pushing tag ${GITHUB_REF_NAME} to ${PUBLIC_REPO}"
          git -c http.extraheader="$AUTH_HEADER" push public "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES=""
          if [ -f "$CHANGELOG_PATH" ]; then
            NOTES="$(awk -v v="$VERSION" '
              BEGIN { capture = 0 }
              /^## \[/ {
                if (capture) exit
                if (index($0, "[" v "]") || index($0, "[Unreleased]")) { capture = 1; next }
              }
              capture { print }
            ' "$CHANGELOG_PATH" | sed '/./,$!d' | sed -e :a -e '/^$/{$d;N;ba' -e '}')"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        # Tag push: only on a private caller with no mirror. Dispatch: always.
        if: ${{ inputs.create_github_release && (steps.scope.outputs.public == 'true' || (inputs.public_repo == '' && github.event.repository.private)) }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT || secrets.GITHUB_TOKEN }}
          PUBLIC_REPO: ${{ inputs.public_repo }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO_FLAG=""
          if [ -n "$PUBLIC_REPO" ]; then
            REPO_FLAG="--repo $PUBLIC_REPO"
          fi
          # `gh release create` errors if the release already exists, so try
          # to edit-then-create; whichever succeeds wins.
          if gh release view "$TAG" $REPO_FLAG >/dev/null 2>&1; then
            gh release edit "$TAG" $REPO_FLAG --title "$TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" $REPO_FLAG --title "$TAG" --notes "$RELEASE_NOTES"
          fi

      - name: Notify Satis to rebuild the catalog
        # The public tag just landed, so the private Composer index at
        # packages.codenzia.com must reindex immediately — otherwise the release
        # is invisible to consumers until the nightly rebuild (up to 24h stale).
        # Reuses CODENZIA_PAT (a classic repo-scoped PAT can POST a
        # repository_dispatch to Codenzia/satis). Non-fatal: nightly cron is the
        # safety net, so a transient dispatch failure never fails the release.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CODENZIA_PAT empty; skipping Satis notify (nightly rebuild will catch this release)."
            exit 0
          fi
          # Send the composer package name (canonical in composer.json, even on
          # -dev-suffixed repos) so Satis can run a fast partial rebuild for just
          # this package instead of a ~10-min full scan. Missing/unreadable name
          # degrades to the payload-less dispatch, which Satis treats as "full".
          PKG=$(jq -r '.name // ""' composer.json 2>/dev/null || true)
          if [ -n "$PKG" ]; then
            PAYLOAD=$(jq -cn --arg p "$PKG" '{event_type: "package-released", client_payload: {package: $p}}')
          else
            echo "::warning::composer.json name unreadable; dispatching a full Satis rebuild."
            PAYLOAD='{"event_type":"package-released"}'
          fi
          if curl -fsS -X POST \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/Codenzia/satis/dispatches \
               -d "$PAYLOAD"; then
            echo "Dispatched package-released to Codenzia/satis (package: ${PKG:-full rebuild})."
          else
            echo "::warning::Satis dispatch failed; nightly rebuild will catch this release."
          fi
