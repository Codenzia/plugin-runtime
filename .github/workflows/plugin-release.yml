name: Plugin Release (reusable)

# Reusable release workflow. Triggered when a `v*` tag is pushed to the
# caller's repo (typically a `-dev` private repo). Mirrors the tagged
# commit + tag to the public repo, then creates a GitHub Release there.
# Packagist auto-detects the new tag via its webhook on the public repo
# — no Packagist-specific step is needed once the package is submitted.
#
# Example caller in <plugin>-dev/.github/workflows/release.yml:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     release:
#       uses: Codenzia/plugin-runtime/.github/workflows/plugin-release.yml@main
#       with:
#         public_repo: Codenzia/filament-panel-base   # omit for public-only repos
#       secrets: inherit

on:
  workflow_call:
    inputs:
      public_repo:
        description: |
          Public mirror repo in <org/name> format, e.g. "Codenzia/filament-panel-base".
          When set, the workflow force-pushes HEAD + the triggering tag to that repo
          (uses CODENZIA_PAT). When empty, the workflow assumes the caller IS the
          public repo and only creates the GitHub Release.
        required: false
        type: string
        default: ""
      target_branch:
        description: "Branch to push HEAD to on the public mirror"
        required: false
        type: string
        default: "main"
      create_github_release:
        description: "Create a GitHub Release on the resulting (public) repo from the tag"
        required: false
        type: boolean
        default: true
      changelog_path:
        description: "Path to CHANGELOG.md. Used to extract release notes for the matching tag."
        required: false
        type: string
        default: "CHANGELOG.md"
    secrets:
      CODENZIA_PAT:
        required: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout (with full history + tags)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Don't leave the default github-actions token persisted in
          # .git/config — it overrides the CODENZIA_PAT auth header on the
          # mirror push, so the push goes out as github-actions[bot] and is
          # denied (403) on the public repo. With this off, only the explicit
          # PAT header is used.
          persist-credentials: false

      - name: Verify tag shape
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Refusing to release: tag '${GITHUB_REF_NAME}' is not semver-shaped (vMAJOR.MINOR.PATCH[-PRERELEASE])" >&2
            exit 1
          fi
          echo "tag: ${GITHUB_REF_NAME}"

      - name: Push commit + tag to public mirror
        if: ${{ inputs.public_repo != '' }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
          PUBLIC_REPO: ${{ inputs.public_repo }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "CODENZIA_PAT secret not set; cannot push to $PUBLIC_REPO" >&2
            exit 1
          fi
          git config user.email "actions@github.com"
          git config user.name  "github-actions[bot]"
          git remote add public "https://github.com/${PUBLIC_REPO}.git"
          # Ephemeral header-based auth: never written to .git/config (unlike a
          # token-in-URL remote), so the PAT can't leak via a later config dump.
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          # Populate refs/remotes/public/<branch> so --force-with-lease has a
          # lease to check; tolerate a not-yet-existing branch (first release).
          git -c http.extraheader="$AUTH_HEADER" fetch public "+refs/heads/${TARGET_BRANCH}:refs/remotes/public/${TARGET_BRANCH}" || true
          echo "Pushing HEAD to ${PUBLIC_REPO}:${TARGET_BRANCH}"
          git -c http.extraheader="$AUTH_HEADER" push public "HEAD:refs/heads/${TARGET_BRANCH}" --force-with-lease
          echo "Pushing tag ${GITHUB_REF_NAME} to ${PUBLIC_REPO}"
          git -c http.extraheader="$AUTH_HEADER" push public "${GITHUB_REF_NAME}"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES=""
          if [ -f "$CHANGELOG_PATH" ]; then
            NOTES="$(awk -v v="$VERSION" '
              BEGIN { capture = 0 }
              /^## \[/ {
                if (capture) exit
                if (index($0, "[" v "]") || index($0, "[Unreleased]")) { capture = 1; next }
              }
              capture { print }
            ' "$CHANGELOG_PATH" | sed '/./,$!d' | sed -e :a -e '/^$/{$d;N;ba' -e '}')"
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          {
            echo "notes<<EOF_NOTES"
            echo "$NOTES"
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: ${{ inputs.create_github_release }}
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT || secrets.GITHUB_TOKEN }}
          PUBLIC_REPO: ${{ inputs.public_repo }}
          RELEASE_NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          REPO_FLAG=""
          if [ -n "$PUBLIC_REPO" ]; then
            REPO_FLAG="--repo $PUBLIC_REPO"
          fi
          # `gh release create` errors if the release already exists, so try
          # to edit-then-create; whichever succeeds wins.
          if gh release view "$TAG" $REPO_FLAG >/dev/null 2>&1; then
            gh release edit "$TAG" $REPO_FLAG --title "$TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" $REPO_FLAG --title "$TAG" --notes "$RELEASE_NOTES"
          fi

      - name: Notify Satis to rebuild the catalog
        # The public tag just landed, so the private Composer index at
        # packages.codenzia.com must reindex immediately — otherwise the release
        # is invisible to consumers until the nightly rebuild (up to 24h stale).
        # Reuses CODENZIA_PAT (a classic repo-scoped PAT can POST a
        # repository_dispatch to Codenzia/satis). Non-fatal: nightly cron is the
        # safety net, so a transient dispatch failure never fails the release.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.CODENZIA_PAT }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::CODENZIA_PAT empty; skipping Satis notify (nightly rebuild will catch this release)."
            exit 0
          fi
          if curl -fsS -X POST \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               https://api.github.com/repos/Codenzia/satis/dispatches \
               -d '{"event_type":"package-released"}'; then
            echo "Dispatched package-released to Codenzia/satis."
          else
            echo "::warning::Satis dispatch failed; nightly rebuild will catch this release."
          fi
