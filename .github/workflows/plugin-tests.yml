name: Plugin Tests (reusable)

# Reusable test workflow for Codenzia Filament / Laravel packages.
# Callers in each plugin repo invoke this via `uses:` and pass a single
# `pure_laravel` flag to switch between the Filament matrix and the
# Laravel-only matrix.
#
# Example caller (see README.md for full snippets):
#
#   jobs:
#     tests:
#       uses: Codenzia/plugin-runtime/.github/workflows/plugin-tests.yml@v1.2.0
#       with:
#         pure_laravel: false   # default; set true for non-Filament packages
#       secrets: inherit        # REQUIRED — Composer needs the Satis credentials
#
# Callers MUST pass `secrets: inherit`. In-house packages resolve from the
# private Satis registry at packages.codenzia.com, which needs the repo-level
# SATIS_USER / SATIS_PASS secrets (org-level secrets resolve empty on the
# GitHub Free org), plus CODENZIA_PAT for private GitHub sources.

on:
  workflow_call:
    inputs:
      pure_laravel:
        description: "true = Laravel-only matrix (no Filament dimension)"
        required: false
        type: boolean
        default: false
      pint:
        description: "Run `pint --test` as a step of the first matrix leg"
        required: false
        type: boolean
        default: true
      skip_filament_v5:
        description: |
          Skip the Filament v5 matrix entries (both L12+F5 and L13+F5).
          Use temporarily when a transitive Codenzia plugin dep (e.g.
          filament-media) hasn't shipped its v5 widening to the public
          mirror yet, so composer can't resolve F5 even though this
          package supports it.
        required: false
        type: boolean
        default: false
      skip_filament_v4:
        description: |
          Skip the Filament v4 matrix entry (L12+F4). Use when the plugin
          has migrated to F5-only namespaces (e.g. Filament\Schemas) and
          no longer compiles under F4. Pair with `skip_filament_v5: false`
          for an F5-only build.
        required: false
        type: boolean
        default: false
      php_extensions:
        description: "PHP extensions installed on the runner"
        required: false
        type: string
        default: "mbstring, dom, fileinfo, gd, zip, sqlite, pdo_sqlite, sodium"
    secrets:
      CODENZIA_PAT:
        description: "PAT with read access to private Codenzia/* package sources"
        required: false
      SATIS_USER:
        description: "HTTP basic username for packages.codenzia.com"
        required: false
      SATIS_PASS:
        description: "HTTP basic password for packages.codenzia.com"
        required: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Built inline — a dedicated job that only echoes this JSON cost a full
      # billed minute per run across every consumer repo.
      # `pint: true` marks the single leg that also runs the style check.
      matrix:
        include: ${{ fromJSON(
          inputs.pure_laravel
            && '[{"php":"8.3","laravel":"12.*","testbench":"10.*","pint":true},{"php":"8.3","laravel":"13.*","testbench":"11.*"}]'
          || inputs.skip_filament_v5
            && '[{"php":"8.3","laravel":"12.*","testbench":"10.*","filament":"4.*","pint":true}]'
          || inputs.skip_filament_v4
            && '[{"php":"8.3","laravel":"12.*","testbench":"10.*","filament":"5.*","pint":true},{"php":"8.3","laravel":"13.*","testbench":"11.*","filament":"5.*"}]'
          || '[{"php":"8.3","laravel":"12.*","testbench":"10.*","filament":"4.*","pint":true},{"php":"8.3","laravel":"12.*","testbench":"10.*","filament":"5.*"},{"php":"8.3","laravel":"13.*","testbench":"11.*","filament":"5.*"}]'
          ) }}
    name: L${{ matrix.laravel }}${{ matrix.filament && format(' F{0}', matrix.filament) || '' }} PHP${{ matrix.php }}
    env:
      # Private Satis registry + private GitHub sources. Without this Composer
      # gets HTTP 401 from packages.codenzia.com and dies with
      # "You must be using the interactive console to authenticate".
      COMPOSER_AUTH: >-
        {"github-oauth":{"github.com":"${{ secrets.CODENZIA_PAT }}"},
         "http-basic":{"packages.codenzia.com":{"username":"${{ secrets.SATIS_USER }}","password":"${{ secrets.SATIS_PASS }}"}}}
    steps:
      - name: Validate matrix inputs
        if: ${{ inputs.skip_filament_v4 && inputs.skip_filament_v5 }}
        run: |
          echo "::error::skip_filament_v4 and skip_filament_v5 are both true — no Filament matrix would run. Pick one."
          exit 1

      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ inputs.php_extensions }}
          tools: composer:v2, pint
          coverage: none

      - name: Resolve composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-filament${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-filament${{ matrix.filament }}-

      - name: Pin Laravel, Testbench (+ Filament) versions
        env:
          FILAMENT: ${{ matrix.filament }}
        run: |
          PKGS=(
            "laravel/framework:${{ matrix.laravel }}"
            "orchestra/testbench:${{ matrix.testbench }}"
          )
          if [ -n "$FILAMENT" ]; then
            PKGS+=("filament/filament:$FILAMENT")
          fi
          composer require "${PKGS[@]}" --no-interaction --no-update --dev

      - name: Ignore known Filament v5 beta advisory
        # Composer's audit.block-insecure feature refuses to install packages
        # with active security advisories during dependency resolution — that's
        # blocking filament/tables v5.0.0-beta* under PKSA-5bdf-2x61-v43c.
        # Ignore just that advisory so other advisories still fail CI. Remove
        # once Filament v5 stable ships.
        run: composer config --json audit.ignore '["PKSA-5bdf-2x61-v43c"]'

      - name: Install Composer dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --compact

      - name: Check code style
        # Folded in from what used to be a standalone `pint` job — a whole
        # runner per consumer repo for ~6 seconds of work.
        if: ${{ inputs.pint && matrix.pint }}
        run: pint --test
